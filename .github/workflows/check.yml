name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Static analysis (ruff)
        run: ruff check quantlab/ tests/ user_data/strategies/
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Risk policy audit
        run: python -m quantlab.risk_policy
      # data-check 依赖本地行情文件，仅在本机 make check 中执行
